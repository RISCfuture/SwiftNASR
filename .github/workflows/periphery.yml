name: Periphery
on:
  push:
    branches: [main]
  pull_request:
jobs:
  periphery:
    name: Run Periphery
    # xcode-27: scanning builds the package, which needs the macOS 27 SDK.
    runs-on: xcode-27
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-periphery-xcode-27-${{ hashFiles('Package.resolved') }}
      - name: Install Periphery
        run: brew install periphery-pro/tap/periphery-cli
      - name: Run Periphery
        env:
          PERIPHERY_TOKEN: ${{ secrets.PERIPHERY_TOKEN }}
        run: periphery scan --strict
