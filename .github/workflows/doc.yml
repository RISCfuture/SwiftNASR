name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Generate Documentation
    # macOS: the CoreLocation-gated Location extension is absent from the
    # Linux symbol graph, so its documentation would be missing there.
    # xcode-27: the package's macOS 27 floor needs the macOS 27 SDK to build.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-docs-xcode-27-${{ hashFiles('Package.resolved') }}
      - name: Build
        run: |
          swift package \
           --allow-writing-to-directory ./docs \
           generate-documentation --target SwiftNASR --output-path ./docs \
           --disable-indexing \
           --transform-for-static-hosting \
           --hosting-base-path SwiftNASR
      - name: Create root redirect
        run: |
          cat > ./docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=/SwiftNASR/documentation/swiftnasr/">
              <title>SwiftNASR Documentation</title>
              <script>
                  window.location.replace("/SwiftNASR/documentation/swiftnasr/");
              </script>
          </head>
          <body>
              <p>Redirecting to <a href="/SwiftNASR/documentation/swiftnasr/">SwiftNASR Documentation</a>...</p>
          </body>
          </html>
          EOF
      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: "docs/"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
